name: Architecture Lint

# NOTE: Ring-boundary import enforcement, export-allow-list checking,
# and service-locator prohibition now live in architecture-boundary-lint.yml.
# This workflow handles documentation/reference-structure checks only.
# See: architecture-boundary-lint.yml for the executable architecture fitness gate.

on:
  push:
    paths:
      - 'Architecture/**'
      - 'anvil/**'
      - '.github/workflows/architecture-lint.yml'
  pull_request:
    paths:
      - 'Architecture/**'
      - 'anvil/**'
      - '.github/workflows/architecture-lint.yml'
  workflow_dispatch: {}

jobs:
  lint:
    name: architecture-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Run architecture-lint
        run: php Architecture/Verification/lint/run.php

      # Note: as of this workflow's introduction, run.php performs exactly
      # 3 checks (reference existence, misattribution phrases, structural
      # completeness) — see Architecture/CrossCutting/REPO-STATE-AUDIT.md §5.
      # Do not assume broader coverage (Pulse consistency, naming drift,
      # Soft-Freeze, blueprint-fidelity) is enforced here yet; those are
      # cooldown-expansion targets per SDLC-AGRD.md §6, not current scope.
