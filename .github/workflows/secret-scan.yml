name: Secret Scan

# =============================================================================
# DGLab secret scanning (SAAI remediation Phase 1).
#
# Policy (deliberate choices, each with a reason — not incidental):
#   * SCOPE = the tracked working tree at the checkout (gitleaks `dir` mode,
#     no history). A full-history scan would flag pre-existing, already-public
#     material (e.g. the dev TLS pair tracked before PR #360) and turn the gate
#     into permanent noise. History scanning/rewriting is a SEPARATE,
#     explicitly-approved decision — do not "fix" history findings by muting
#     this job.
#   * ENFORCEMENT IS ITSELF TESTED: every run first plants a canary (a fake,
#     non-functional AWS-style key) in a temp dir and asserts gitleaks flags it.
#     A gitleaks misconfiguration therefore fails CI loudly instead of passing
#     vacuously. (Per SAAI: "a control is only trustworthy when it verifies the
#     actual state ... and fails visibly when its guarantee is broken.")
#   * SUPPRESSION IS EXPLICIT AND JUSTIFIED: only .gitleaks.toml
#     [allowlist.paths] entries, each carrying its rationale in a comment.
#     Inline "gitleaks:allow" annotations are NOT sanctioned without a register
#     entry.
#
# Pinned supply: gitleaks v8.24.3 linux/x64 tarball, SHA-256 verified against
# the release's own checksums.txt at runtime (pinned-tag download + integrity
# check; no third-party actions).
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (working tree, pinned)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          asset="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o "$asset" "${base}/${asset}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${V}_checksums.txt"
          # Compare by hash directly (robust to '<hash>  <name>' vs '<hash> *<name>'
          # checksum layouts; sha256sum -c would require the on-disk filename to
          # equal the listed one — it is, but this keeps the check name-format-free).
          expected=$(awk -v a="$asset" '$2==a {print $1; exit}' checksums.txt)
          if [ -z "$expected" ]; then echo "::error::asset $asset not found in checksums.txt"; exit 1; fi
          actual=$(sha256sum "$asset" | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then echo "::error::CHECKSUM MISMATCH for $asset"; exit 1; fi
          echo "OK: sha256 verified ($actual)"
          tar xzf "$asset"
          ./gitleaks version | grep -F "$V"

      - name: Self-test — canary secret MUST be detected
        # If this step fails, the scanner is broken/misconfigured and a green
        # scan would be false confidence. Fail loudly by design.
        run: |
          set -euo pipefail
          canary=$(mktemp -d)
          # Deliberately inert. NOTE: must NOT use AWS's documentation example
          # keys (AKIAIOSFODNN7EXAMPLE / wJalrXUtnFEMI…) — gitleaks' default
          # config allowlists exactly those, so they would vacuously "pass".
          # This is a non-allowlisted synthetic key in the AKIA+16 format with
          # a random-shape 40-char secret; neither is real. The literals are
          # split with adjacent-string concatenation so that NO contiguous
          # secret-shaped token exists in this file (otherwise the tree scan
          # below would correctly flag its own canary's source). The runtime
          # value assembled into the temp dir is what the scanner must catch.
          FAKE_ID='AKIA''RE1FAKEKEY12345X'
          FAKE_SECRET='Zx9KqLmT2nVb7RtY4sPdAfGhJkL5cWeN0mX''yBuVi'
          cat > "$canary/canary.env" <<CANARY
          AWS_ACCESS_KEY_ID=${FAKE_ID}
          aws_secret_access_key = "${FAKE_SECRET}"
          CANARY
          # Detection criterion: a NON-EMPTY JSON leak report. (Empirically,
          # gitleaks 8.24.3 `dir` mode prints leaks but exits 0, so --exit-code
          # cannot be the oracle here; a missing/invalid report file means the
          # invocation itself broke — that must fail, not pass.)
          set +e
          out=$(./gitleaks dir "$canary" --redact --report-format json --report-path canary-leaks.json 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out"
            echo "::error::gitleaks invocation failed (exit=$rc) — fix the scanner, do not mute this step."
            exit 1
          fi
          if [ ! -f canary-leaks.json ]; then
            printf '%s\n' "$out"
            echo "::error::gitleaks produced no report file — invocation semantics changed; treat as scanner-broken, not clean."
            exit 1
          fi
          if python3 -c "import json,sys; sys.exit(0 if len(json.load(open('canary-leaks.json')))>0 else 1)"; then
            echo "OK: canary detected by gitleaks (self-test passed)."
          else
            printf '%s\n' "$out"
            echo "::error::Secret-scan self-test FAILED — the planted canary was NOT flagged. A green tree scan would be UNVERIFIED. Fix the scanner, do not mute this step."
            exit 1
          fi
          rm -rf "$canary" canary-leaks.json

      - name: Scan working tree
        run: |
          set -euo pipefail
          ./gitleaks dir . --config .gitleaks.toml --redact --report-format json --report-path leaks.json
          # Same contract as the canary: the JSON report is the oracle.
          if python3 - <<'PY'
          import json, os, sys
          if not os.path.exists('leaks.json'):
              print("::error::gitleaks produced no report file — scanner broken, not clean (fail-closed).")
              sys.exit(2)
          leaks = json.load(open('leaks.json'))
          for l in leaks[:50]:
              print(f"LEAK: {l.get('File')}:{l.get('Line')} rule={l.get('RuleID')} secret={l.get('Secret','')[:4]}…(redacted)")
          sys.exit(1 if leaks else 0)
          PY
          then
            echo "Working tree clean: 0 leaks (report: leaks.json)."
          else
            echo "::error::Secrets found in tracked tree. Remediate or (only with written rationale) extend .gitleaks.toml allowlist — inline mutes require a register entry."
            exit 1
          fi

      - name: Summary note
        if: success()
        run: echo "gitleaks dir-scan of tracked tree at \${{ github.sha }} passed." >> "$GITHUB_STEP_SUMMARY"
