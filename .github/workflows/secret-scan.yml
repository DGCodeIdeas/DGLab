name: Secret Scan

# =============================================================================
# DGLab secret scanning (SAAI remediation Phase 1).
#
# Policy (deliberate choices, each with a reason — not incidental):
#   * SCOPE = the tracked working tree at the checkout (gitleaks `dir` mode,
#     no history). A full-history scan would flag pre-existing, already-public
#     material (e.g. the dev TLS pair tracked before PR #360) and turn the gate
#     into permanent noise. History scanning/rewriting is a SEPARATE,
#     explicitly-approved decision — do not "fix" history findings by muting
#     this job.
#   * ENFORCEMENT IS ITSELF TESTED: every run first plants a canary (a fake,
#     non-functional AWS-style key) in a temp dir and asserts gitleaks flags it.
#     A gitleaks misconfiguration therefore fails CI loudly instead of passing
#     vacuously. (Per SAAI: "a control is only trustworthy when it verifies the
#     actual state ... and fails visibly when its guarantee is broken.")
#   * SUPPRESSION IS EXPLICIT AND JUSTIFIED: only .gitleaks.toml
#     [allowlist.paths] entries, each carrying its rationale in a comment.
#     Inline "gitleaks:allow" annotations are NOT sanctioned without a register
#     entry.
#
# Pinned supply: gitleaks v8.24.3 linux/x64 tarball, SHA-256 verified against
# the release's own checksums.txt at runtime (pinned-tag download + integrity
# check; no third-party actions).
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (working tree, pinned)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz\$" checksums.txt > checksum.line
          sha256sum -c checksum.line
          tar xzf gitleaks.tar.gz ./gitleaks
          ./gitleaks version | grep -F "$V"

      - name: Self-test — canary secret MUST be detected
        # If this step fails, the scanner is broken/misconfigured and a green
        # scan would be false confidence. Fail loudly by design.
        run: |
          set -euo pipefail
          canary=$(mktemp -d)
          # Deliberately inert: AWS docs example key ID + obviously-fake secret.
          cat > "$canary/canary.env" <<'CANARY'
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          CANARY
          if ./gitleaks dir "$canary" --no-banner --redact --exit-code 0 | grep -q "Leaks found"; then
            echo "OK: canary detected by gitleaks."
          else
            echo "::error::Secret-scan self-test FAILED — gitleaks did not detect the planted canary. Treat all green results on this job as UNVERIFIED."
            exit 1
          fi
          rm -rf "$canary"

      - name: Scan working tree
        run: |
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
        continue-on-error: false

      - name: Summary note
        if: success()
        run: echo "gitleaks dir-scan of tracked tree at \${{ github.sha }} passed." >> "$GITHUB_STEP_SUMMARY"
