# =============================================================================
# SemVer Release Automation — driven by the Loom (CORE-01)
#
# Status: ASPIRATIONAL. This workflow is gated on the repo variable
# `LOOM_RELEASE_ENABLED=1` (default off) and will not run until that flag is
# flipped. P0 gaps (tag-prefix, path-scoped commits, tag push, monorepo
# awareness) were closed in PR #110. P1 gap 7 (assertClean) was closed in
# PR #112. The remaining open gaps are P1/P2:
#
#   - `loom version:bump --format=json`        (P2 gap 9 — JSON output)
#   - `loom version:release <package>`         (P2 gap 8 — composite command)
#   - Conventional-Commit PR title enforcement  (P1 gap 5 — branch protection)
#   - `--require-ci-green` on tag:create       (P1 gap 6 — CI gate in loom)
#   - composer.json version field auto-sync     (P2 gap 10 — done inline below)
#   - repos.json generation as loom command     (P2 gap 11 — done inline below)
#
# See Architecture/Core/CORE-01.md §SemVer Automation Plan for the full gap
# analysis and the path to close each item.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release (e.g. core/container). Leave empty to release all with pending changes.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (compute bumps, do not tag or push)'
        required: false
        default: 'true'

# Do not run concurrently with packages-ci.yml — let CI finish first so the
# CI-green gate below is meaningful.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: SemVer release (${{ matrix.package }})
    runs-on: ubuntu-latest
    if: vars.LOOM_RELEASE_ENABLED == '1'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        package:
          - core/container
          - core/event-dispatcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — required for `git log <tag>..HEAD`
          token: ${{ secrets.LOOM_RELEASE_PAT }}   # PAT with `contents: write` to push tags

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, dom
          tools: composer:v2

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate repos.json from packages/*/composer.json
        # P2 gap 11 — until loom can scan packages/ itself, generate the config
        # file at workflow start. Each package maps to a MonorepoPackage entry
        # with its directory as `ci_url` and its short-name as the tag prefix.
        run: |
          php -r '
            $pkgs = [];
            foreach (glob("packages/*/*/composer.json") as $path) {
              $json = json_decode(file_get_contents($path), true);
              $shortName = basename(dirname($path));   // "container" / "event-dispatcher"
              $tierName  = basename(dirname(dirname($path)));  // "core"
              $pkgs[] = [
                "name"      => "{$tierName}/{$shortName}",
                "ci_url"    => realpath(dirname($path)),
                "token"     => "",
                "tier"      => $tierName,
                "tag_prefix" => "{$tierName}-{$shortName}-v",
                "depends_on" => [],
              ];
            }
            file_put_contents("orchestrator/repos.json", json_encode($pkgs, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));
            echo "Generated orchestrator/repos.json with " . count($pkgs) . " packages.\n";
          '

      - name: Verify bin/loom is present and executable (Finding 21 guard)
        run: test -x orchestrator/bin/loom && orchestrator/bin/loom status

      - name: Gate — require CI green on main
        # P1 gap 6 — until `tag:create --require-ci-green` exists inline, gate
        # at the workflow level by querying the GitHub Checks API for the
        # triggering commit. Fail the job if any required check is not green.
        env:
          GH_TOKEN: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          set -e
          # Wait briefly for packages-ci.yml to finish if it's still pending.
          sleep 15
          RUN_ID=$(gh run list --workflow=packages-ci.yml --branch=main --limit=1 --json databaseId --jq '.[0].databaseId')
          CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::packages-ci.yml conclusion was '$CONCLUSION' — refusing to tag a red main."
            exit 1
          fi
          echo "packages-ci.yml is green; proceeding."

      - name: Gate — require clean working tree
        # Uses `loom status:clean` (P1 gap 7 — closed). The repos.json file
        # generated above is an expected untracked file under orchestrator/,
        # so we pass it via --allow-untracked.
        run: |
          orchestrator/bin/loom status:clean --allow-untracked orchestrator/repos.json

      - name: Compute next version for ${{ matrix.package }}
        id: bump
        # P2 gap 9 — until `--format=json` ships, this step will print a human
        # table. We parse it with sed; once JSON ships, swap to `--from-json`.
        # P0 gaps 1 and 3 are CLOSED — the loom now uses MonorepoPackage to
        # derive the tag prefix and path scope automatically, so version:bump
        # correctly reads prefixed tags (e.g. core-event-dispatcher-v1.0.0)
        # and filters commits to the package's subdirectory.
        run: |
          set -e
          OUTPUT=$(orchestrator/bin/loom version:bump "${{ matrix.package }}" 2>&1) || {
            echo "::warning::loom version:bump failed. Output:"
            echo "$OUTPUT"
            echo "has_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "$OUTPUT"
          NEW_VERSION=$(printf '%s\n' "$OUTPUT" | sed -nE 's/^New version:\s+([0-9]+\.[0-9]+\.[0-9]+)\s*$/\1/p' | head -1)
          INCREMENT=$(printf '%s\n' "$OUTPUT" | sed -nE 's/^Increment:\s+([a-z]+)\s*$/\1/p' | head -1)
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Could not parse new version from loom output."
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "increment=$INCREMENT" >> "$GITHUB_OUTPUT"
          echo "has_bump=true" >> "$GITHUB_OUTPUT"

      - name: Compare with current composer.json version
        id: compare
        if: steps.bump.outputs.has_bump == 'true'
        run: |
          CURRENT=$(jq -r '.version // ""' "packages/${{ matrix.package }}/composer.json")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "${{ steps.bump.outputs.new_version }}" ]; then
            echo "No version change for ${{ matrix.package }} (current=$CURRENT, computed=${{ steps.bump.outputs.new_version }}). Skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run check
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry-run: would tag ${{ matrix.package }} at ${{ steps.bump.outputs.new_version }} (${{ steps.bump.outputs.increment }} bump)."
          echo "Set dry_run=false (or remove the input) on a workflow_dispatch run to actually tag."

      - name: Create and push tag via loom
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        # P2 gap 8 — until `loom version:release <package>` exists, this step
        # does the two-step manually: bump composer.json version field, commit,
        # then call loom tag:create + loom tag:push. Once version:release ships,
        # replace this block with `orchestrator/bin/loom version:release "${{ matrix.package }}"`.
        # P0 gaps 1 and 4 are CLOSED — the loom now handles tag-prefix derivation
        # (via MonorepoPackage) and tag push (via RepoManager::pushTag) natively.
        env:
          LOOM_RELEASE_PAT: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          set -e
          PKG_PATH="packages/${{ matrix.package }}"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Bump the composer.json version field in the same commit (P2 gap 10).
          jq --arg v "$NEW_VERSION" '.version = $v' "$PKG_PATH/composer.json" > "$PKG_PATH/composer.json.tmp"
          mv "$PKG_PATH/composer.json.tmp" "$PKG_PATH/composer.json"

          git config user.name  "loom-release-bot"
          git config user.email "loom-release-bot@users.noreply.github.com"
          git add "$PKG_PATH/composer.json"
          git commit -m "chore(${{ matrix.package }}): bump version to $NEW_VERSION"

          # PAT hygiene: use a one-shot token URL, never persist to git config.
          # The loom's tag:push accepts a URL in place of a named remote.
          ORIGIN_URL=$(git remote get-url origin)
          TOKEN_URL=$(printf '%s\n' "$ORIGIN_URL" | sed -E "s#(https://github.com/)#${LOOM_RELEASE_PAT}@\\1#")

          # Create the tag locally via loom. The tag PREFIX is derived
          # automatically from the package name by MonorepoPackage:
          #   - core/container → core-container-v<X.Y.Z>
          #     (with legacyTagPattern matching the grandfathered v1.0.0)
          #   - core/event-dispatcher → core-event-dispatcher-v<X.Y.Z>
          TAG_MESSAGE="Release ${{ matrix.package }} $NEW_VERSION (${{ steps.bump.outputs.increment }} bump). Computed by: loom version:bump. Triggered by: ${{ github.actor }} via ${{ github.event_name }}."
          orchestrator/bin/loom tag:create "${{ matrix.package }}" "$NEW_VERSION" --message "$TAG_MESSAGE"

          # Push the tag to the remote via loom.
          orchestrator/bin/loom tag:push "${{ matrix.package }}" "$NEW_VERSION" "$TOKEN_URL"

          # Push the composer.json bump commit to main.
          git push "$TOKEN_URL" main

          # Restore the original remote URL (token hygiene).
          git remote set-url origin "$ORIGIN_URL"
          echo "::notice::Tagged ${{ matrix.package }} at $NEW_VERSION"

      - name: Create GitHub Release
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          SHORT=$(basename "${{ matrix.package }}")
          TIER=$(dirname "${{ matrix.package }}")
          if [ "$TIER/$SHORT" = "core/container" ]; then
            TAG_NAME="v${{ steps.bump.outputs.new_version }}"
          else
            TAG_NAME="${TIER}-${SHORT}-v${{ steps.bump.outputs.new_version }}"
          fi
          gh release create "$TAG_NAME" \
            --title "${{ matrix.package }} ${{ steps.bump.outputs.new_version }}" \
            --generate-notes \
            --target main
