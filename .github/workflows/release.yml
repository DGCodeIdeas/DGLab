# =============================================================================
# SemVer Release Automation — driven by the Loom (CORE-01)
#
# Status: ASPIRATIONAL. This workflow is gated on the repo variable
# `LOOM_RELEASE_ENABLED=1` (default off) and will not run until that flag is
# flipped. P0 gaps (tag-prefix, path-scoped commits, tag push, monorepo
# awareness) were closed in PR #110. P1 gap 7 (assertClean) was closed in
# PR #112. P1 gap 6 (--require-ci-green) was closed in PR #113. P2 gaps 8-11
# (version:release composite, --format=json, composer.json sync, repos:generate)
# were closed in PR #114. The remaining open gap is:
#
#   - Conventional-Commit PR title enforcement  (P1 gap 5 — branch protection)
#
# See Architecture/Core/CORE-01.md §SemVer Automation Plan for the full gap
# analysis and the path to close each item.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release (e.g. core/container). Leave empty to release all with pending changes.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (compute bumps, do not tag or push)'
        required: false
        default: 'true'

# Do not run concurrently with packages-ci.yml — the loom's
# --require-ci-green flag polls for up to 60 seconds waiting for packages-ci.yml
# to complete; if both jobs ran in parallel and packages-ci.yml was cancelled
# by a later push, the gate would block forever.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: SemVer release (${{ matrix.package }})
    runs-on: ubuntu-latest
    if: vars.LOOM_RELEASE_ENABLED == '1'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        package:
          - core/container
          - core/event-dispatcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — required for `git log <tag>..HEAD`
          token: ${{ secrets.LOOM_RELEASE_PAT }}   # PAT with `contents: write` to push tags

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, dom
          tools: composer:v2

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate repos.json (P2 gap 11 — closed)
        # `loom repos:generate` scans packages/*/*/composer.json and writes
        # orchestrator/repos.json. Replaces the previous inline PHP script.
        run: orchestrator/bin/loom repos:generate

      - name: Verify bin/loom is present and executable (Finding 21 guard)
        run: test -x orchestrator/bin/loom && orchestrator/bin/loom

      - name: Gate — require clean working tree
        # Uses `loom status:clean` (P1 gap 7 — closed). The repos.json file
        # generated above is an expected untracked file under orchestrator/,
        # so we pass it via --allow-untracked.
        run: |
          orchestrator/bin/loom status:clean --allow-untracked orchestrator/repos.json

      - name: Compute next version for ${{ matrix.package }}
        id: bump
        # P2 gap 9 (CLOSED) — `loom version:bump --format=json` emits a JSON
        # object; jq parses it cleanly. No more sed-scraping of human output.
        # P0 gaps 1 and 3 are CLOSED — MonorepoPackage derives the tag prefix
        # and path scope automatically.
        run: |
          set -e
          OUTPUT=$(orchestrator/bin/loom version:bump "${{ matrix.package }}" --format=json 2>&1) || {
            echo "::warning::loom version:bump failed. Output:"
            echo "$OUTPUT"
            echo "has_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "$OUTPUT"
          NEW_VERSION=$(printf '%s\n' "$OUTPUT" | jq -r '.new_version // empty')
          INCREMENT=$(printf '%s\n' "$OUTPUT" | jq -r '.increment // empty')
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Could not parse new_version from loom JSON output."
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "increment=$INCREMENT" >> "$GITHUB_OUTPUT"
          echo "has_bump=true" >> "$GITHUB_OUTPUT"

      - name: Compare with current composer.json version
        id: compare
        if: steps.bump.outputs.has_bump == 'true'
        run: |
          CURRENT=$(jq -r '.version // ""' "packages/${{ matrix.package }}/composer.json")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "${{ steps.bump.outputs.new_version }}" ]; then
            echo "No version change for ${{ matrix.package }} (current=$CURRENT, computed=${{ steps.bump.outputs.new_version }}). Skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run check
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry-run: would release ${{ matrix.package }} at ${{ steps.bump.outputs.new_version }} (${{ steps.bump.outputs.increment }} bump)."
          echo "Set dry_run=false (or remove the input) on a workflow_dispatch run to actually release."

      - name: Release via loom (P2 gaps 8, 9, 10 — closed)
        # `loom version:release` is the composite command that:
        #   1. Asserts clean working tree (--allow-untracked for repos.json).
        #   2. Gates on CI green via --require-ci-green (P1 gap 6 — closed).
        #   3. Bumps the composer.json "version" field (Manifest::setVersion).
        #   4. Commits the composer.json change (RepoManager::commitFile).
        #   5. Creates the annotated tag locally (RepoManager::tag).
        #   6. Pushes the tag to --remote (RepoManager::pushTag).
        # The workflow then pushes the bump commit to main separately.
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          LOOM_RELEASE_PAT: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          set -e
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Set git identity for the bump commit (RepoManager::commitFile
          # uses the caller's configured identity).
          git config user.name  "loom-release-bot"
          git config user.email "loom-release-bot@users.noreply.github.com"

          # PAT hygiene: build a one-shot token URL, never persist to git config.
          # The loom's version:release --remote accepts a URL in place of a named remote.
          ORIGIN_URL=$(git remote get-url origin)
          TOKEN_URL=$(printf '%s\n' "$ORIGIN_URL" | sed -E "s#(https://github.com/)#${LOOM_RELEASE_PAT}@\\1#")

          TAG_MESSAGE="Release ${{ matrix.package }} $NEW_VERSION (${{ steps.bump.outputs.increment }} bump). Computed by: loom version:release. Triggered by: ${{ github.actor }} via ${{ github.event_name }}."

          orchestrator/bin/loom version:release "${{ matrix.package }}" \
            --message "$TAG_MESSAGE" \
            --remote "$TOKEN_URL" \
            --require-ci-green \
            --ci-workflow packages-ci.yml \
            --ci-branch main \
            --ci-repo ${{ github.repository }} \
            --ci-timeout 60 \
            --allow-untracked orchestrator/repos.json

          # Push the composer.json bump commit to main.
          git push "$TOKEN_URL" main

          # Restore the original remote URL (token hygiene).
          git remote set-url origin "$ORIGIN_URL"
          echo "::notice::Released ${{ matrix.package }} at $NEW_VERSION"

      - name: Create GitHub Release
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          SHORT=$(basename "${{ matrix.package }}")
          TIER=$(dirname "${{ matrix.package }}")
          if [ "$TIER/$SHORT" = "core/container" ]; then
            TAG_NAME="v${{ steps.bump.outputs.new_version }}"
          else
            TAG_NAME="${TIER}-${SHORT}-v${{ steps.bump.outputs.new_version }}"
          fi
          gh release create "$TAG_NAME" \
            --title "${{ matrix.package }} ${{ steps.bump.outputs.new_version }}" \
            --generate-notes \
            --target main
