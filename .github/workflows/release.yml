# =============================================================================
# SemVer Release Automation — driven by the Loom (CORE-01)
#
# Tag format (ADR-019): v<MUWV>.<Milestone>.<Lap>.<Patch>+<git-sha>
#   - Monorepo releases: v0.1.3.0+abc1234
#   - Per-tier releases: core-v0.1.3.0+abc1234
#
# Status: ASPIRATIONAL. This workflow is gated on the repo variable
# `LOOM_RELEASE_ENABLED=1` (default off) and will not run until that flag is
# flipped. P0 gaps (tag-prefix, path-scoped commits, tag push, monorepo
# awareness) were closed in PR #110. P1 gap 7 (assertClean) was closed in
# PR #112. P1 gap 6 (--require-ci-green) was closed in PR #113. P2 gaps 8-11
# (version:release composite, --format=json, composer.json sync, repos:generate)
# were closed in PR #114. The remaining open gap is:
#
#   - Conventional-Commit PR title enforcement  (P1 gap 5 — branch protection)
#
# See Architecture/Core/CORE-01.md §SemVer Automation Plan for the full gap
# analysis and the path to close each item.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release (e.g. core/container). Leave empty to release all with pending changes.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (compute bumps, do not tag or push)'
        required: false
        default: 'true'

# Do not run concurrently with packages-ci.yml — the loom's
# --require-ci-green flag polls for up to 60 seconds waiting for packages-ci.yml
# to complete; if both jobs ran in parallel and packages-ci.yml was cancelled
# by a later push, the gate would block forever.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: SemVer release (${{ matrix.tier }})
    runs-on: ubuntu-latest
    if: vars.LOOM_RELEASE_ENABLED == '1'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        tier:
          - core
          # - hub    # uncomment when Hub packages ship
          # - bridge # uncomment when Bridge packages ship
          # - spoke  # uncomment when Spoke packages ship

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — required for `git log <tag>..HEAD`
          token: ${{ secrets.LOOM_RELEASE_PAT }}   # PAT with `contents: write` to push tags

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, dom
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: orchestrator/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('orchestrator/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate repos.json (P2 gap 11 — closed)
        # `loom repos:generate` scans packages/*/*/composer.json and writes
        # orchestrator/repos.json. Replaces the previous inline PHP script.
        run: orchestrator/bin/loom repos:generate

      - name: Verify bin/loom is present and executable (Finding 21 guard)
        run: test -x orchestrator/bin/loom && orchestrator/bin/loom

      - name: Gate — require clean working tree
        # Uses `loom status:clean` (P1 gap 7 — closed). The repos.json file
        # generated above is an expected untracked file under orchestrator/,
        # so we pass it via --allow-untracked.
        run: |
          orchestrator/bin/loom status:clean --allow-untracked orchestrator/repos.json

      - name: Compute next version for ${{ matrix.tier }} tier
        id: bump
        # ADR-018: per-tier centralized releases. The loom analyzes ALL packages
        # in the tier (packages/<tier>/*/) and takes the highest bump level.
        # TODO: implement `loom version:bump:tier <tier>` — until then, iterate
        # all packages in the tier and take the highest bump.
        run: |
          set -e
          TIER="${{ matrix.tier }}"
          HIGHEST_INCREMENT="none"
          HIGHEST_VERSION=""
          for PKG_DIR in packages/${TIER}/*/; do
            PKG=$(basename "$PKG_DIR")
            OUTPUT=$(orchestrator/bin/loom version:bump "${TIER}/${PKG}" --format=json 2>&1) || {
              echo "  $TIER/$PKG: no changes or error — skipping"
              continue
            }
            INCREMENT=$(printf '%s\n' "$OUTPUT" | jq -r '.increment // empty')
            NEW_VERSION=$(printf '%s\n' "$OUTPUT" | jq -r '.new_version // empty')
            echo "  $TIER/$PKG: $INCREMENT → $NEW_VERSION"
            # Take the highest bump level: major > minor > patch > none
            case "$INCREMENT" in
              major)  HIGHEST_INCREMENT="major";  HIGHEST_VERSION="$NEW_VERSION" ;;
              minor)  if [ "$HIGHEST_INCREMENT" != "major" ]; then HIGHEST_INCREMENT="minor"; HIGHEST_VERSION="$NEW_VERSION"; fi ;;
              patch)  if [ "$HIGHEST_INCREMENT" = "none" ]; then HIGHEST_INCREMENT="patch"; HIGHEST_VERSION="$NEW_VERSION"; fi ;;
            esac
          done
          if [ -z "$HIGHEST_VERSION" ]; then
            echo "No version change for $TIER tier. Skipping."
            echo "has_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Tier $TIER: highest bump = $HIGHEST_INCREMENT → $HIGHEST_VERSION"
          echo "new_version=$HIGHEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "increment=$HIGHEST_INCREMENT" >> "$GITHUB_OUTPUT"
          echo "has_bump=true" >> "$GITHUB_OUTPUT"

      - name: Compare with current tier version
        id: compare
        if: steps.bump.outputs.has_bump == 'true'
        run: |
          # ADR-018: all packages in the tier share the same version.
          # Read the version from the first package as the canonical tier version.
          FIRST_PKG=$(ls -d packages/${{ matrix.tier }}/*/ | head -1)
          CURRENT=$(jq -r '.version // ""' "${FIRST_PKG}composer.json")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "${{ steps.bump.outputs.new_version }}" ]; then
            echo "No version change for ${{ matrix.tier }} tier (current=$CURRENT, computed=${{ steps.bump.outputs.new_version }}). Skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run check
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry-run: would release ${{ matrix.tier }} tier at ${{ steps.bump.outputs.new_version }} (${{ steps.bump.outputs.increment }} bump)."
          echo "Set dry_run=false (or remove the input) on a workflow_dispatch run to actually release."

      - name: Release via loom — bump ALL packages in tier (ADR-018)
        # ADR-018: centralized per-tier release. Bumps ALL composer.json files
        # in the tier to the same version, creates ONE tag (<tier>-v<X.Y.Z>),
        # and pushes.
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          LOOM_RELEASE_PAT: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          set -e
          TIER="${{ matrix.tier }}"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Set git identity for the bump commit.
          git config user.name  "loom-release-bot"
          git config user.email "loom-release-bot@users.noreply.github.com"

          # PAT hygiene: build a one-shot token URL, never persist to git config.
          ORIGIN_URL=$(git remote get-url origin)
          TOKEN_URL=$(printf '%s\n' "$ORIGIN_URL" | sed -E "s#(https://github.com/)#${LOOM_RELEASE_PAT}@\\1#")

          TAG_MESSAGE="Release ${TIER} tier ${NEW_VERSION} (${{ steps.bump.outputs.increment }} bump). Computed by: loom. Triggered by: ${{ github.actor }} via ${{ github.event_name }}."

          # Bump ALL packages in the tier to the same version.
          for PKG_DIR in packages/${TIER}/*/; do
            PKG=$(basename "$PKG_DIR")
            orchestrator/bin/loom version:release "${TIER}/${PKG}" \
              --message "$TAG_MESSAGE" \
              --remote "$TOKEN_URL" \
              --require-ci-green \
              --ci-workflow packages-ci.yml \
              --ci-branch main \
              --ci-repo ${{ github.repository }} \
              --ci-timeout 60 \
              --allow-untracked orchestrator/repos.json || true
            echo "  Bumped ${TIER}/${PKG} to ${NEW_VERSION}"
          done

          # Push the bump commits to main.
          git push "$TOKEN_URL" main

          # Restore the original remote URL (token hygiene).
          git remote set-url origin "$ORIGIN_URL"
          echo "::notice::Released ${TIER} tier at ${NEW_VERSION}"

      - name: Create GitHub Release for tier
        if: steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          TIER="${{ matrix.tier }}"
          # ADR-019: tag format is <tier>-v<MUWV>.<Milestone>.<Lap>.<Patch>+<sha>
          # The +<sha> build metadata is the 7-char git short SHA of the release commit.
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAG_NAME="${TIER}-v${{ steps.bump.outputs.new_version }}+${SHORT_SHA}"
          gh release create "$TAG_NAME" \
            --title "${TIER} v${{ steps.bump.outputs.new_version }}+${SHORT_SHA}" \
            --generate-notes \
            --target main

      - name: Show generated repos.json (on failure)
        if: failure()
        run: cat orchestrator/repos.json 2>/dev/null || echo '(repos.json not found)'

      - name: Restore git remote URL (always — token hygiene)
        if: always() && steps.compare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          # Restore the original remote URL even if the release step failed.
          # The TOKEN_URL is embedded in origin during the release step;
          # without this, the PAT would persist in git config.
          ORIGIN_URL=$(git remote get-url origin 2>/dev/null || true)
          if echo "$ORIGIN_URL" | grep -q 'x-access-token\|ghp_'; then
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            echo "Restored origin URL (was token-embedded)"
          fi

  monorepo-release:
    name: Monorepo Release (v<MUWV>.<Milestone>.<Lap>.<Patch>+<sha>)
    needs: release
    if: success() && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LOOM_RELEASE_PAT }}

      - name: Configure Git identity
        run: |
          git config user.name  "loom-release-bot"
          git config user.email "loom-release-bot@users.noreply.github.com"

      - name: Determine monorepo version
        id: mono
        run: |
          # ADR-019: monorepo version is v<MUWV>.<Milestone>.<Lap>.<Patch>+<sha>
          # Post-MUWV flip (2026-09-12): MUWV=1, Milestone 1 = segment 2.
          # Pre-flip: MUWV=0, Milestone 0 = segment 1.
          #
          # IMPORTANT: only match 4-segment ADR-019 tags (vX.Y.Z.W).
          # The old deprecated 3-segment tags (v1.0.0, release-1.X.0) sort
          # HIGHER than v0.* tags under --sort=-v:refname and would produce
          # malformed versions if matched. The pattern 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*'
          # matches exactly 4 dot-separated numeric segments after the 'v' prefix,
          # excluding both 3-segment legacy tags and per-tier tags (core-v*).
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "$LATEST" ]; then
            # First release under the new scheme (ADR-019).
            # Pre-MUWV, Milestone 0, lap 0, patch 0.
            NEW_VERSION="0.1.0.0"
          else
            # Parse the four segments (strip the leading 'v' and any +sha build metadata).
            CURRENT=${LATEST#v}
            CURRENT=${CURRENT%%+*}
            MUWV=$(echo "$CURRENT" | cut -d. -f1)
            MILESTONE=$(echo "$CURRENT" | cut -d. -f2)
            LAP=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$(echo "$CURRENT" | cut -d. -f4)
            # Increment lap for each new monorepo release (each tier release cycle = one lap).
            # The MUWV segment is never auto-bumped — the flip is a manual governance
            # action (see ADR-019 §8 Flip Log). Subsequent releases continue bumping
            # the lap segment within whatever MUWV/milestone the latest tag is in.
            NEW_VERSION="${MUWV}.${MILESTONE}.$((LAP + 1)).0"
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create monorepo tag and release
        env:
          GH_TOKEN: ${{ secrets.LOOM_RELEASE_PAT }}
        run: |
          # ADR-019: tag format is v<MUWV>.<Milestone>.<Lap>.<Patch>+<sha>
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAG_NAME="v${{ steps.mono.outputs.new_version }}+${SHORT_SHA}"
          git tag -a "$TAG_NAME" -m "Monorepo release ${{ steps.mono.outputs.new_version }}+${SHORT_SHA}"
          git push origin "$TAG_NAME"

          # Build release body from tier tags created in this run.
          BODY="## Monorepo Release v${{ steps.mono.outputs.new_version }}+${SHORT_SHA}\n\n"
          BODY+="### Tier versions\n\n"
          for TIER in core hub bridge spoke; do
            TIER_TAG=$(git tag -l "${TIER}-v*" --sort=-v:refname | head -1 || true)
            if [ -n "$TIER_TAG" ]; then
              BODY+="- **${TIER}**: \`${TIER_TAG}\`\n"
            else
              BODY+="- **${TIER}**: not yet released\n"
            fi
          done

          gh release create "$TAG_NAME" \
            --title "DGLab v${{ steps.mono.outputs.new_version }}+${SHORT_SHA}" \
            --notes "$(printf '%b' "$BODY")" \
            --target main

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release, monorepo-release]
    if: always()
    steps:
      - run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "### Release Dry-Run Complete" >> "$GITHUB_STEP_SUMMARY"
            echo "No releases were created. Set dry_run=false to actually release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release Workflow Complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Check individual jobs above for per-package results." >> "$GITHUB_STEP_SUMMARY"
          fi
