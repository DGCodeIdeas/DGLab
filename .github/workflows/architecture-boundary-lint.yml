name: Architecture Boundary Lint

# Per SPEC-001 §40 (Phase 1 — Enforce Ring Boundaries) + §41 (Container Service-Locator Rule).
# This workflow enforces:
#   1. Ring-boundary dependency direction (per ADR-004 tier-enforcement DAG).
#      e.g., Core MUST NOT import Hub; Hub MUST NOT import Spoke; etc.
#   2. Container service-locator prohibition (SPEC §3 + §41). Production code
#      MUST NOT call $container->get()/make()/resolve(), Container::getInstance(),
#      Container::resolve(), or app(). Narrowed to container-specific receivers
#      so legitimate domain resolvers (MiddlewareResolver::resolve(),
#      ContractRegistry::resolve(), PerRequestHandler, Vanguard) pass.
#
# Sister workflow to architecture-lint.yml (which checks documentation/reference
# structure). This workflow checks executable ring-boundary rules.
#
# INVARIANT (per SAAI directive 2026-10-06): Three-state reporting.
#   PASS       — control executed and passed
#   FAIL       — control executed and failed
#   UNVERIFIED — control did not execute (e.g., 0 files scanned, ImportError,
#                runner misconfiguration). MUST NOT be reported as green.
# A green architecture-boundary-lint result MUST mean the boundary was actually
# inspected — not that the scanner found zero files. The 'Verify scan coverage'
# step below enforces this invariant by failing the workflow if files_scanned == 0.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'app/**'
      - 'scripts/architecture-boundary-lint.py'
      - 'scripts/architecture-boundary-lint.php'
      - '.github/workflows/architecture-boundary-lint.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'app/**'
      - 'scripts/architecture-boundary-lint.py'
      - 'scripts/architecture-boundary-lint.php'
      - '.github/workflows/architecture-boundary-lint.yml'
  workflow_dispatch: {}

jobs:
  boundary-lint:
    name: architecture-boundary-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # Required because scripts/architecture-boundary-lint.py imports `yaml`
        # (PyYAML) at line 42 to parse .github/architecture-export-allowlist.yaml.
        # Pre-existing bug discovered while verifying PR #312: the workflow's
        # "Set up Python" step installed Python but not PyYAML, causing every
        # PR that touched the trigger paths to fail with ModuleNotFoundError.
        run: pip install pyyaml

      - name: Run architecture-boundary-lint
        # Output: JSON summary on stdout + human-readable report on stderr.
        # Exit code: 0 = no violations, 1 = violations, 2 = checker error.
        run: python3 scripts/architecture-boundary-lint.py | tee /tmp/abl-summary.json

      - name: Verify scan coverage
        # INVARIANT (per SAAI directive 2026-10-06): A green result MUST mean
        # the boundary was actually inspected. If files_scanned == 0, the
        # scanner found nothing to inspect (e.g., wrong REPO_ROOT, missing
        # packages/ directory, broken checkout) — this is UNVERIFIED, not PASS.
        # Pre-existing bug: PR #312's CI showed files_scanned=0 but the step
        # succeeded because the script exited 0 on empty results. This step
        # fails the workflow if files_scanned == 0, preventing false-positive
        # green status.
        run: |
          files_scanned=$(python3 -c "import json; print(json.load(open('/tmp/abl-summary.json'))['files_scanned'])" 2>/dev/null || echo 0)
          echo "files_scanned=$files_scanned"
          if [ "$files_scanned" -eq 0 ]; then
            echo "::error::architecture-boundary-lint scanned 0 files. This is UNVERIFIED, not PASS. The scanner likely has a wrong REPO_ROOT or the checkout is missing packages/. Per SAAI invariant: 'A green result MUST mean the boundary was actually inspected.'"
            exit 1
          fi
          echo "✓ scan coverage verified: $files_scanned files inspected"

      - name: Run architecture-boundary-lint regression tests
        # Per SPEC-001 §41 Acceptance: "False positives are covered by regression tests."
        # Runs 13 tests covering:
        #   - Live repo has 0 false positives on 6 legitimate resolve() callers
        #   - Live repo has 0 ring-boundary violations
        #   - Live repo has 0 service-locator violations
        #   - Synthetic violations (Core→Hub, $container->get/make/resolve, app()) ARE flagged
        #   - Legitimate domain resolvers ($this->resolver->resolve, $this->contracts->resolve) NOT flagged
        #   - Method definitions (function resolve) NOT flagged
        #   - PSR imports allowed from any ring
        run: python3 scripts/test_architecture_boundary_lint.py

      # Note: a PHP equivalent of this checker exists at
      # scripts/architecture-boundary-lint.php for contractor environments
      # where PHP 8.4 is the primary runtime. The Python version is used in
      # CI for portability; both versions produce identical output.

      - name: Upload violation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-boundary-lint-report
          path: |
            # JSON summary is printed to stdout; the workflow captures exit code
            # 1 = violations, 0 = clean. The full report is on stderr in the
            # workflow log. If a structured artifact is desired in the future,
            # pipe stdout to a file and add it here.
          if-no-files-found: ignore
          retention-days: 14
