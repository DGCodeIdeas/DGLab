name: Packages CI

# =============================================================================
# Path Gate pattern — satisfies the "Packages CI" required status check
# for docs-only PRs without running the full test matrix.
#
# The `gate` job always runs on pull_request (no paths filter). It detects
# whether package/orchestrator/anvil files changed:
#   - If NO  → gate succeeds, test jobs are skipped, suite reports success
#   - If YES → gate succeeds, test jobs run, suite reports success only if
#              all matrix entries pass
#
# This allows docs-only PRs (Architecture/, archive/, README, etc.) to merge
# without waiting for a Packages CI run that would never trigger.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Core/**'
      - 'Hub/**'
      - 'Bridge/**'
      - 'Spokes/**'
      - 'orchestrator/**'
      - 'anvil/**'
      - 'app/**'
      - 'public/**'
      - 'tests/**'
      - 'phpunit.xml.dist'
      - '.github/workflows/packages-ci.yml'
  pull_request: {}  # always trigger on PRs — gate job handles path detection
  workflow_dispatch: {}

jobs:
  gate:
    name: Path Gate
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff

      - name: Check if package files changed
        id: check
        run: |
          set -x
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "Base: $BASE"
            echo "Head: $HEAD"
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
              | grep -E '^(packages/|orchestrator/|anvil/|app/|public/|tests/|composer\.json|\.github/workflows/packages-ci\.yml)' \
              || true)
            if [ -n "$CHANGED" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "::notice::Package files changed — full CI matrix will run"
              echo "$CHANGED" | head -20
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "::notice::No package files changed — skipping CI matrix"
            fi
          else
            # push or workflow_dispatch — always run full CI
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::Non-PR event — full CI matrix will run"
          fi

      - name: CI matrix completeness (Phase 2 guard)
        # Every eligible package (composer.json + src/ + tests/ + phpunit.xml.dist)
        # MUST be in the matrix below or carry a reasoned line in
        # scripts/ci-matrix-exclusions.txt. Also fails UNVERIFIED (0 packages
        # discovered) and on stale exclusions — the control verifies actual state,
        # and cannot report green vacuously.
        run: python3 scripts/check-ci-matrix-completeness.py

  test:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    name: PHPUnit + PHPStan (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core/container
            working-dir: packages/core/container
          - package: core/event-dispatcher
            working-dir: packages/core/event-dispatcher
          - package: core/http-message
            working-dir: packages/core/http-message
          - package: core/middleware
            working-dir: packages/core/middleware
          - package: core/router
            working-dir: packages/core/router
          - package: core/config
            working-dir: packages/core/config
          - package: core/logger
            working-dir: packages/core/logger
          - package: core/error-handler
            working-dir: packages/core/error-handler
          - package: core/kernel
            working-dir: packages/core/kernel
          - package: core/dbal
            working-dir: packages/core/dbal
          - package: core/crypto
            working-dir: packages/core/crypto
          - package: core/neospx
            working-dir: packages/core/neospx
          - package: core/view
            working-dir: packages/core/view
          - package: Core/Filesystem
            working-dir: Core/Filesystem
          - package: spoke/internal/showcase
            working-dir: packages/spoke/internal/showcase
          - package: hub/config
            working-dir: packages/hub/config
          - package: hub/identity
            working-dir: packages/hub/identity
          - package: bridge/vanguard
            working-dir: packages/bridge/vanguard
          - package: spoke/internal/codex
            working-dir: packages/spoke/internal/codex
          - package: spoke/external/canvas
            working-dir: packages/spoke/external/canvas
          - package: spoke/internal/lms
            working-dir: packages/spoke/internal/lms
          - package: orchestrator
            working-dir: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — required for git-tag-based version tests

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, xml, dom, openssl
          tools: composer:v2

      - name: Configure Git identity (for tests that create commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Migrated tier-dir components (Core/, Hub/, etc.) have no per-package composer.json.
      - name: Validate root composer.json (migrated components)
        if: startsWith(matrix.working-dir, 'Core/') || startsWith(matrix.working-dir, 'Hub/') || startsWith(matrix.working-dir, 'Bridge/') || startsWith(matrix.working-dir, 'Spokes/')
        run: composer validate --no-check-publish --no-check-version

      - name: Install root dependencies (migrated components)
        if: startsWith(matrix.working-dir, 'Core/') || startsWith(matrix.working-dir, 'Hub/') || startsWith(matrix.working-dir, 'Bridge/') || startsWith(matrix.working-dir, 'Spokes/')
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json (packages/ layout)
        if: !(startsWith(matrix.working-dir, 'Core/') || startsWith(matrix.working-dir, 'Hub/') || startsWith(matrix.working-dir, 'Bridge/') || startsWith(matrix.working-dir, 'Spokes/'))
        working-directory: ${{ matrix.working-dir }}
        run: composer validate --no-check-publish --no-check-version

      - name: Clean vendor directory
        working-directory: ${{ matrix.working-dir }}
        run: rm -rf vendor

      - name: Install dependencies
        working-directory: ${{ matrix.working-dir }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level max)
        working-directory: ${{ matrix.working-dir }}
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --error-format=github
          else
            ../../../vendor/bin/phpstan analyse --error-format=github
          fi

      - name: PHPUnit (full suite, testdox)
        working-directory: ${{ matrix.working-dir }}
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --testdox --colors=never --no-coverage
          else
            ../../../vendor/bin/phpunit --configuration phpunit.xml.dist --testdox --colors=never --no-coverage
          fi

      - name: PHPUnit (PSR-11 conformance, named)
        if: matrix.package == 'core/container'
        working-directory: ${{ matrix.working-dir }}
        run: vendor/bin/phpunit --filter Psr11Conformance --testdox --colors=never --no-coverage

      - name: Verify bin/loom is executable (Finding 21 guard)
        if: matrix.package == 'orchestrator'
        working-directory: ${{ matrix.working-dir }}
        run: |
          set -x
          ls -la bin/loom
          test -x bin/loom
          which php
          php -v
          php bin/loom || echo "loom exited with $?"
          set +x

  integration:
    name: Root integration (public entry point smoke)
    # Runs tests/Integration/ (root phpunit.xml.dist) — guards the historical
    # public/index.php ↔ ApplicationFactory divergence class (PRs #195/#197).
    # Previously the test file existed with NO runner; this job is that runner.
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, xml, dom, openssl, fileinfo
          tools: composer:v2

      - name: Clean vendor directory
        run: rm -rf vendor

      - name: Install root dependencies (path repos -> vendor symlinks)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit — root integration suite
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --testdox --colors=never --no-coverage
