name: Packages CI

# =============================================================================
# Path Gate pattern — satisfies the "Packages CI" required status check
# for docs-only PRs without running the full test matrix.
#
# The `gate` job always runs on pull_request (no paths filter). It detects
# whether package/orchestrator/anvil files changed:
#   - If NO  → gate succeeds, test jobs are skipped, suite reports success
#   - If YES → gate succeeds, test jobs run, suite reports success only if
#              all matrix entries pass
#
# This allows docs-only PRs (Architecture/, archive/, README, etc.) to merge
# without waiting for a Packages CI run that would never trigger.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'orchestrator/**'
      - 'anvil/**'
      - '.github/workflows/packages-ci.yml'
  pull_request: {}  # always trigger on PRs — gate job handles path detection
  workflow_dispatch: {}

jobs:
  gate:
    name: Path Gate
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff

      - name: Check if package files changed
        id: check
        run: |
          set -x
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "Base: $BASE"
            echo "Head: $HEAD"
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
              | grep -E '^(packages/|orchestrator/|anvil/|\.github/workflows/packages-ci\.yml)' \
              || true)
            if [ -n "$CHANGED" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "::notice::Package files changed — full CI matrix will run"
              echo "$CHANGED" | head -20
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "::notice::No package files changed — skipping CI matrix"
            fi
          else
            # push or workflow_dispatch — always run full CI
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::Non-PR event — full CI matrix will run"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    name: PHPUnit + PHPStan (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core/container
            working-dir: packages/core/container
          - package: core/event-dispatcher
            working-dir: packages/core/event-dispatcher
          - package: core/http-message
            working-dir: packages/core/http-message
          - package: core/middleware
            working-dir: packages/core/middleware
          - package: core/router
            working-dir: packages/core/router
          - package: core/config
            working-dir: packages/core/config
          - package: core/logger
            working-dir: packages/core/logger
          - package: core/error-handler
            working-dir: packages/core/error-handler
          - package: core/kernel
            working-dir: packages/core/kernel
          - package: core/dbal
            working-dir: packages/core/dbal
          - package: hub/config
            working-dir: packages/hub/config
          - package: bridge/vanguard
            working-dir: packages/bridge/vanguard
          - package: spoke/internal/codex
            working-dir: packages/spoke/internal/codex
          - package: spoke/external/canvas
            working-dir: packages/spoke/external/canvas
          - package: spoke/internal/lms
            working-dir: packages/spoke/internal/lms
          - package: orchestrator
            working-dir: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — required for git-tag-based version tests

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, xml, dom
          tools: composer:v2

      - name: Configure Git identity (for tests that create commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Validate composer.json
        working-directory: ${{ matrix.working-dir }}
        run: composer validate --no-check-publish --no-check-version

      - name: Install dependencies
        working-directory: ${{ matrix.working-dir }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level max)
        working-directory: ${{ matrix.working-dir }}
        run: vendor/bin/phpstan analyse --error-format=github

      - name: PHPUnit (full suite, testdox)
        working-directory: ${{ matrix.working-dir }}
        run: vendor/bin/phpunit --testdox --colors=never --no-coverage

      - name: PHPUnit (PSR-11 conformance, named)
        if: matrix.package == 'core/container'
        working-directory: ${{ matrix.working-dir }}
        run: vendor/bin/phpunit --filter Psr11Conformance --testdox --colors=never --no-coverage

      - name: Verify bin/loom is executable (Finding 21 guard)
        if: matrix.package == 'orchestrator'
        working-directory: ${{ matrix.working-dir }}
        run: |
          set -x
          ls -la bin/loom
          test -x bin/loom
          which php
          php -v
          php bin/loom || echo "loom exited with $?"
          set +x
