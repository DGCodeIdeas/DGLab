name: Architecture Lint

on:
  pull_request:
    paths:
      - 'Architecture/**'
  push:
    branches:
      - main
    paths:
      - 'Architecture/**'

jobs:
  lint:
    name: Verify architecture consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run architecture linter
        run: php Architecture/Verification/lint/run.php
